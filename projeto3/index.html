<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company ABC</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="container d-flex">
        <h1>Company ABC</h1>
        <nav>
          <a href=""> Home </a>
          <a href=""> Sobre </a>
          <a href=""> Serviços </a>
          <a href=""> Produtos </a>
          <a href=""> Contato </a>
        </nav>
      </div>
    </header>
    <section>
      <div class="container d-flex">
        <div>
          <h2>
            Full Service
            <span> Residential and commercial </span>
          </h2>
          <p>Lawn Care & Maintenance</p>
        </div>
      </div>
      <form action="" method="post">
        <h3>Agendamento</h3>
        <p>Preencha seus dados</p>
        <input type="text" placeholder="Nome" name="nome" required />
        <input type="email" placeholder="Email" name="email" required />
        <input type="number" placeholder="Telefone" name="telefone" required />
        <input type="date" placeholder="Data" name="data" required />
        <button type="submit">Agendar</button>
      </form>
    </section>
  </body>
</html>
